name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Smoke-test the CLI
        run: cognitive-twin demo --steps 30

  postgres:
    name: Tests on PostgreSQL (real migrations, triggers, least-privilege role)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

  security:
    name: Security scans (R3.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,aws,otel]"
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          pip freeze --exclude-editable > /tmp/requirements.lock
          pip-audit --strict --progress-spinner off -r /tmp/requirements.lock
      - name: Static analysis (bandit)
        run: bandit -q -r src -x src/cognitive_twin/db/migrations

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cognitive-twin:ci .
      - name: Image vulnerability scan (fails on HIGH or CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cognitive-twin:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infrastructure:
    name: Terraform and alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive deploy/terraform
      - run: terraform init -backend=false
        working-directory: deploy/terraform
      - run: terraform validate
        working-directory: deploy/terraform
      - name: Alert rules
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz | tar xz
          ./prometheus-2.54.1.linux-amd64/promtool check rules deploy/observability/alerts.yml
          cd deploy/observability && ../../prometheus-2.54.1.linux-amd64/promtool test rules alerts_test.yml
