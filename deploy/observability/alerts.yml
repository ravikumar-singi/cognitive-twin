# Prometheus alert rules (R5.2). Loaded into Amazon Managed Prometheus by Terraform;
# they work unchanged on any Prometheus. Each alert names its runbook.
groups:
  - name: cognitive-twin
    rules:
      - alert: CTHighErrorRate
        expr: |
          sum(rate(ct_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(ct_http_requests_total[5m])), 1e-9) > 0.02
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "More than 2% of requests are failing"
          runbook: docs/runbooks/incident-response.md

      - alert: CTLedgerChainBroken
        expr: min(ct_ledger_chain_ok) == 0
        for: 0m
        labels: {severity: page}
        annotations:
          summary: "The credential ledger failed hash-chain verification"
          runbook: docs/runbooks/ledger-chain-broken.md

      - alert: CTKeyServiceFailures
        expr: sum(increase(ct_key_service_errors_total[5m])) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Signing with KMS is failing; credentials cannot be issued"
          runbook: docs/runbooks/key-management.md

      - alert: CTTeachingStepSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(
            ct_http_request_duration_seconds_bucket{route=~"/api/me/(next|answer)"}[5m]))) > 0.3
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "p95 teaching-step latency is above the 300 ms target"
          runbook: docs/runbooks/incident-response.md

      - alert: CTGuardianInterventionSpike
        expr: sum(rate(ct_guardian_interventions_total[15m])) > 3 * sum(rate(ct_guardian_interventions_total[6h] offset 1d))
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "The safety guardian is overriding the agents far more than usual; check the latest policy version"
          runbook: docs/runbooks/policy-rollback.md

      - alert: CTNoTraffic
        expr: sum(rate(ct_http_requests_total{route!="/healthz"}[15m])) == 0
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "No requests for 30 minutes during the pilot"
